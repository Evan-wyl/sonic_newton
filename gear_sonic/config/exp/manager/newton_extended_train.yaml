# @package _global_
# Short training validation with startup property randomization.
defaults:
  - /exp/manager/newton_short_train
  - _self_

experiment_name: extended_features
manager_env:
  config:
    enable_com_randomization: true
    record_physics_properties: true
  events:
    base_com:
      _target_: isaaclab.managers.EventTermCfg
      func: gear_sonic.envs.manager_env.mdp:randomize_rigid_body_com
      mode: startup
      params:
        asset_cfg:
          _target_: isaaclab.managers.SceneEntityCfg
          name: robot
          body_names: torso_link
        com_range:
          x: [-0.025, 0.025]
          y: [-0.05, 0.05]
          z: [-0.05, 0.05]
    physics_material:
      _target_: isaaclab.managers.EventTermCfg
      func: gear_sonic.envs.manager_env.mdp:randomize_rigid_body_material
      mode: startup
      params:
        asset_cfg:
          _target_: isaaclab.managers.SceneEntityCfg
          name: robot
          body_names: .*
        static_friction_range: [0.5, 1.3]
        dynamic_friction_range: [0.5, 1.3]
        restitution_range: [0.0, 0.0]
        num_buckets: 64
    add_joint_default_pos:
      _target_: isaaclab.managers.EventTermCfg
      func: gear_sonic.envs.manager_env.mdp:randomize_joint_default_pos
      mode: startup
      params:
        asset_cfg:
          _target_: isaaclab.managers.SceneEntityCfg
          name: robot
          joint_names: [.*]
        pos_distribution_params: [-0.01, 0.01]
        operation: add
    randomize_rigid_body_mass:
      _target_: isaaclab.managers.EventTermCfg
      func: gear_sonic.envs.manager_env.mdp:randomize_rigid_body_mass
      mode: startup
      params:
        asset_cfg:
          _target_: isaaclab.managers.SceneEntityCfg
          name: robot
          body_names: .*wrist_yaw.*|torso_link
        mass_distribution_params: [0.9, 1.1]
        operation: scale
        recompute_inertia: true
        min_mass: 0.000001
    push_robot:
      _target_: isaaclab.managers.EventTermCfg
      func: gear_sonic.envs.manager_env.mdp:push_by_setting_velocity
      mode: interval
      interval_range_s: [0.2, 0.3]
      params:
        velocity_range:
          x: [-0.05, 0.05]
          y: [-0.05, 0.05]
